[package]
name = "smartdoor-backend"
version = "0.1.0"
edition = "2021"
description = "智能门窗 ERP/MES 后端 API 服务"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "migrate"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
argon2 = "0.5"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"

[dev-dependencies]
# 测试里用 `ServiceExt::oneshot` 把请求打进组装好的 app，验证授权层真的挂在路由上
# （不需要数据库：无令牌的请求在查库之前就被拦下）。
tower = { version = "0.5", features = ["util"] }
