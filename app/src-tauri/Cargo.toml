[package]
name = "smartdoor"
version = "0.1.0"
description = "智能门窗桌面端（Tauri 2 壳）"
edition = "2021"

[lib]
name = "smartdoor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
