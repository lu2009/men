# 每次 push 与 PR 都跑 `npm run verify`（= 仓库根的**统一验证入口**）。
#
# 这里**故意不 exclude 任何东西**：clippy / test 跑的是整个 workspace
# （`backend` + `app/src-tauri`），差分台也是全量 —— 排除掉的那部分恰恰是最没人看、
# 最容易悄悄坏掉的部分。Tauri 的系统依赖因此必须装（见下面的 apt 一步）。
#
# 台子需要的东西，这一份 workflow 全部照本地原样备齐：
#   · postgres 跑在**同名容器** `smartdoor-db` 里（用户名/库名也同本地）——
#     多数台子靠 `docker exec smartdoor-db psql -U smartdoor -d …` 直接读库写库，
#     容器名一变它们就全崩。
#   · 后端由 `verify` 自己起（自带 migrate + 播种管理员），端口 3100、库 `smartdoor_verify`。
#   · `/tmp` 里那几个**夹具**（`home-map.json` / `progress*.json` / `progress.decoded.js`）不在仓库里，
#     CI 上没人事先跑过生成它们的那几步 —— 所以由**台子自己现生成**（缺了就现算，见
#     `docs/home-audit/legacy-slice.mjs` 与 `docs/progress-*.mjs`）。2026-09-20 CI run #1 就是栽在
#     这上面：8 个台子 `ENOENT: /tmp/home-map.json`。**别在 workflow 里补生成步骤** ——
#     台子自给自足才能在别人机器上直接跑。
#
# ⚠️ 有 7 个台子在 CI 上**跑不了**（verify 会显式列出来，不是静默跳过）：
#      · 6 个要在**仓库外**的旧版服务端源码上切函数跑，CI 上没有那份源码
#        （2 个是老的；4 个是 `docs/legacy-finance/0{5,6,7,9}-*.mjs`，2026-09-20 收进收集范围后才显出来）；
#      · 1 个要有**业务配置**（公式 / 打印模板），CI 的空库满足不了。
#    其余 29 个都必须在 CI 上真绿 —— `run-all.mjs` 的 `KNOWN_RED`（「已登记的真红」）
#    2026-09-20 起是空的，所以没有免红牌可打。详见 `docs/verification.md`。

name: CI

on:
  push:
  pull_request:

# 同一分支连推多次时，取消还没跑完的旧任务。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      # ⚠️ 必须取全历史：`docs/home-audit/*-movecheck.mjs` 要 `git show <旧提交>:<路径>`
      # 拿搬迁前的原文来逐字比。默认的 fetch-depth:1 只取 1 个提交 ⇒ 那些 `git show` 会失败。
      # 代价实测：本仓库 size-pack 651 MiB / 283 提交，比后面的 Rust 构建小一个量级。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Tauri 2 在 Linux 上的系统依赖。少了 webkit2gtk 那套，`cargo clippy --workspace`
      # 连 `app/src-tauri` 都编不过 —— 而 workspace 是全量的，所以必须装。
      - name: 装 Tauri 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            build-essential \
            curl wget file

      - name: 装 Rust 工具链（含 rustfmt / clippy）
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # 版本与本地一致（本地 node v24）。`app/` 有自己的 lockfile。
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/package-lock.json

      # 跑台子要用 `docker exec` 直接读写库，所以容器名/用户/库名必须与本地**逐字一致**。
      # 不能改用 Actions 的 `services:`：那种容器的名字是随机的，`docker exec smartdoor-db` 会找不到。
      - name: 起 postgres（容器名与本地一致：smartdoor-db）
        run: |
          # GitHub 的 ubuntu 镜像自带一个跑在 5432 上的 postgres，先让位。
          sudo systemctl stop postgresql || true
          docker run -d --name smartdoor-db \
            -e POSTGRES_USER=smartdoor \
            -e POSTGRES_PASSWORD=smartdoor \
            -e POSTGRES_DB=smartdoor \
            -p 5432:5432 \
            postgres:16-alpine
          for i in $(seq 1 30); do
            docker exec smartdoor-db pg_isready -U smartdoor -d smartdoor && exit 0
            sleep 1
          done
          echo "postgres 30 秒内没就绪" >&2
          docker logs smartdoor-db >&2
          exit 1

      # 一条命令跑全套：fmt / 前端类型检查+生产构建 / clippy / test / 37 个差分台。
      # `verify` 会在 CI 上如实打印「哪几个台子本次没跑」（未运行 ≠ 通过）。
      # 输出同时落一份到 `/tmp/verify.log` 给下一步的失败报告用（`run()` 是 stdio:'inherit'，
      # 所以这里 tee 得到全部输出；`set -o pipefail` 是必须的 —— 少了它管道会把
      # verify 的退出码吃掉，CI 就永远绿了）。
      - name: npm run verify
        run: |
          set -o pipefail
          npm run verify 2>&1 | tee /tmp/verify.log

      # 为什么要有这一步：**job 日志要仓库 admin 权限**（实测非管理员调
      # `GET /actions/jobs/<id>/logs` 一律 403，公开仓库也一样），
      # 而 check-run 的 summary 是**不登录也读得到**的。红了的时候把「挂在谁身上」
      # 写进 summary，就不用等仓库 owner 去网页上翻，也不用靠猜。
      - name: 失败时把红了的台子写进 step summary
        if: failure()
        run: |
          if [ ! -f /tmp/verify.log ]; then
            echo '⚠️ 没跑到 `npm run verify`（前面某一步就挂了）⇒ 看那一步的日志。' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # verify.mjs 的汇总行无条件包 ANSI ⇒ 先剥掉，否则 summary 里是一堆 `[31m`。
          # （run-all.mjs 那边本来就不打颜色码。）
          clean=/tmp/verify.clean.log
          sed -E 's/\x1b\[[0-9;]*[A-Za-z]//g' /tmp/verify.log > "$clean"

          # 只挑「有信息量」的行，别把 37 个台子全贴上来：
          #   `  ✅/❌ <阶段>`  = verify 的 6 阶段汇总
          #   `❌ <文件> …ms …` = run-all 的每个真红台子（🔴 是已登记的真红，也留着）
          #   `   · <文件>`     = run-all 末尾「这些是真失败」的展开（注意是 3 个空格；
          #                      verify 自己的 ⚠️/🔴 展开是 7 个空格 ⇒ 不会被这条带上）
          hits=$(grep -aE '^(❌|🔴|⏭ )|^   · |^共 .* 个台子|^  (✅|❌) ' "$clean" | head -60 || true)

          {
            echo '## ❌ CI 挂了 —— 阶段与红了的台子'
            echo
            echo '```text'
            if [ -n "$hits" ]; then
              echo "$hits"
            else
              echo '（一条 ❌/🔴 都没有 —— 红的多半不是差分台，看下面的尾巴）'
            fi
            echo '```'
            echo
            echo '<details><summary>verify 输出最后 80 行</summary>'
            echo
            echo '```text'
            tail -80 "$clean"
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"
