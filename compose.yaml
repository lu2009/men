services:
  db:
    image: postgres:16-alpine
    container_name: smartdoor-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: smartdoor
      POSTGRES_PASSWORD: smartdoor
      POSTGRES_DB: smartdoor
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartdoor -d smartdoor"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
